<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="512" height="512" fill="none">
  <!-- ±1σ Shaded Standard Deviation Band -->
  <path d="M 26 44 C 31 32, 35 27, 40 27 C 45 27, 49 32, 54 44 L 54 61 L 26 61 Z" fill="#DBEAFE"/>

  <!-- Dashed Mean & ±1σ Inflection Lines -->
  <line x1="40" y1="27" x2="40" y2="61" stroke="#1E3A8A" stroke-width="1.3" stroke-dasharray="2.5 2.5"/>
  <line x1="26" y1="44" x2="26" y2="61" stroke="#1E3A8A" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="54" y1="44" x2="54" y2="61" stroke="#1E3A8A" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Lowercase Sigma (σ) Over the Peak -->
  <text x="40" y="20" text-anchor="middle" fill="#1E3A8A" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" font-weight="700">&#963;</text>

  <!-- Gaussian Distribution Curve -->
  <path d="M 9 61 C 23 61, 29 27, 40 27 C 51 27, 57 61, 71 61" stroke="#111827" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- Baseline Axis -->
  <line x1="7" y1="61" x2="73" y2="61" stroke="#111827" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="round"/>
</svg>
